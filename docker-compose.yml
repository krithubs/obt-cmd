version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: myobt-postgres
    restart: always
    environment:
      POSTGRES_USER: myobt_user
      POSTGRES_PASSWORD: myobt_password
      POSTGRES_DB: myobt_complaints
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myobt_user -d myobt_complaints"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
